[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "akim"
version = "0.1.0"
description = "Steam ve Epic'te yükselen bağımsız oyunları Roblox'taki karşılıklarıyla karşılaştırıp anlık fırsat bildirimi gönderen 7/24 akım izleme sistemi"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# İsteğe bağlı yerel ve ücretsiz Laya karar modeli (config: laya.enabled). PyTorch gerektirir.
laya = ["laya>=0.3.22"]
dev = ["pytest>=8"]

[project.scripts]
akim = "akim.__main__:main"

[tool.setuptools.packages.find]
include = ["akim*"]

[tool.setuptools.package-data]
akim = ["web/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
