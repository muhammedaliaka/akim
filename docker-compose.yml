services:
  akim:
    build: .
    container_name: akim
    restart: unless-stopped        # çökse veya sunucu yeniden başlasa bile tekrar ayağa kalkar
    env_file:
      - path: .env
        required: false
    environment:
      AKIM_CONFIG: /app/config.yaml
    volumes:
      - ./data:/data
      - ./config.yaml:/app/config.yaml:ro
    ports:
      - "8080:8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
