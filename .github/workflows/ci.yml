name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      # Gerçek süreç testleri dahil: sunucu ayrı işlem olarak başlar, sağlık ucu yoklanır, kapatma sinyali
      # (Linux: SIGTERM, Windows: CTRL_BREAK_EVENT) gönderilir ve temiz kapanış doğrulanır.
      - run: python -m pytest -q

  windows-scripts:
    name: windows scripts (Windows PowerShell 5.1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install.ps1
        shell: powershell
        run: .\deploy\windows\install.ps1
      - name: Kurulum çıktılarını doğrula
        shell: powershell
        run: |
          .\.venv\Scripts\akim.exe --version
          foreach ($f in "config.yaml", ".env", ".venv\Scripts\pythonw.exe") {
            if (-not (Test-Path $f)) { throw "$f oluşmadı" }
          }
      - name: autostart.ps1 görevi kaydeder, durumunu verir ve kaldırır
        shell: powershell
        run: |
          .\deploy\windows\autostart.ps1 -TaskName AkimCi
          .\deploy\windows\autostart.ps1 -TaskName AkimCi -Status
          # Görev konsolsuz (pythonw) gerçekten çalışıyor ve varsayılan log dosyasına yazıyor mu?
          $log = "data\akim.log"
          $started = $false
          for ($i = 0; $i -lt 40 -and -not $started; $i++) {
            if ((Test-Path $log) -and (Select-String -Path $log -Pattern "veri:" -Quiet)) { $started = $true } else { Start-Sleep 1 }
          }
          if (-not $started) { if (Test-Path $log) { Get-Content $log }; throw "görev çalışmadı veya log yazmadı" }
          if (-not (Get-Process pythonw -ErrorAction SilentlyContinue)) { throw "pythonw süreci yok" }
          if (-not (Get-ScheduledTask -TaskName AkimCi -ErrorAction SilentlyContinue)) { throw "görev kaydedilmedi" }
          $task = Get-ScheduledTask -TaskName AkimCi
          if ($task.Settings.RestartCount -ne 999 -or -not $task.Settings.RunOnlyIfNetworkAvailable) { throw "görev ayarları eksik" }
          .\deploy\windows\autostart.ps1 -TaskName AkimCi -Remove
          if (Get-ScheduledTask -TaskName AkimCi -ErrorAction SilentlyContinue) { throw "görev kaldırılmadı" }
      - name: run.cmd ile konsolda çalıştır, sağlık ucunu yokla
        shell: cmd
        run: |
          (
            echo steam: {enabled: false}
            echo epic: {enabled: false}
            echo roblox: {enabled: false}
            echo web: {host: 127.0.0.1, port: 18080}
          ) > config.yaml
          start "akim" /b cmd /c deploy\windows\run.cmd
          powershell -NoProfile -Command "for ($i=0; $i -lt 60; $i++) { try { (Invoke-WebRequest http://127.0.0.1:18080/healthz -UseBasicParsing -TimeoutSec 2).StatusCode; exit 0 } catch { Start-Sleep 1 } }; exit 1"

  termux-scripts:
    name: termux scripts (derleyicisiz kurulum, sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install.sh
        run: sh deploy/termux/install.sh
      - name: run.sh ile çalıştır, sağlık ucunu yokla, Ctrl+C ile temiz kapat
        run: |
          printf 'steam: {enabled: false}\nepic: {enabled: false}\nroblox: {enabled: false}\nweb: {host: 127.0.0.1, port: 18080}\n' > config.yaml
          setsid sh deploy/termux/run.sh > run.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:18080/healthz && break; sleep 1; done
          curl -fs http://127.0.0.1:18080/healthz || { cat run.log; exit 1; }
          pkill -INT -f "akim -c config.yaml run"
          sleep 3
          grep -q "Kapatılıyor" run.log || { cat run.log; exit 1; }
          ! grep -q "yeniden başlatılıyor" run.log || { cat run.log; exit 1; }
