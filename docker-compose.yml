services:
  akim:
    build:
      context: .
      args:
        EXTRAS: ""               # yerel ve ücretsiz Laya modeli için: "laya" (bkz. README > Laya)
    container_name: akim
    restart: unless-stopped        # çökse veya sunucu yeniden başlasa bile tekrar ayağa kalkar
    env_file:
      - path: .env
        required: false
    environment:
      AKIM_CONFIG: /app/config.yaml
      AKIM_WEB_HOST: 0.0.0.0          # kapsayıcı içinde; dışarı açılma aşağıdaki "ports" ile sınırlıdır
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./data:/data
      - ./config.yaml:/app/config.yaml:ro
    ports:
      # Yalnızca bu makineden. Telefon/ağ için "8080:8080" yap VE .env'de AKIM_WEB_TOKEN ayarla.
      - "127.0.0.1:8080:8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
