# Akım yapılandırması
# Bu dosyayı config.yaml olarak kopyala. Tüm ayarların varsayılanı vardır;
# yalnızca değiştirmek istediklerini yazman yeterli.
# ${DEGISKEN} ifadeleri ortam değişkeninden (.env) okunur; gizli bilgileri buraya yazma.

general:
  data_dir: ./data            # SQLite veritabanı; göreli yol bu dosyanın klasörüne göre çözülür
  country: US                 # mağaza bölgesi (listeler bu ülkeye göre çekilir)
  language: english
  log_level: INFO
  track_days: 7               # listeden düşen oyun kaç gün daha takip edilsin
  log_file: ""                # dosyaya da log yaz, ör. akim.log (göreli yol bu dosyanın klasörüne göre).
                              # Boşsa yalnızca konsol; konsolsuz çalışmada (Windows Görev Zamanlayıcı) data_dir/akim.log
  keep_awake: true            # Windows'ta bilgisayar boşta uykuya geçmesin (diğer sistemlerde etkisiz)

steam:
  enabled: true
  # topsellers: anlık en çok satanlar · weekly_topsellers: haftalık · most_played: anlık oyuncu
  charts: [topsellers, weekly_topsellers, most_played]
  top_n: 100
  interval_minutes: 15
  ccu_interval_minutes: 30    # takip edilen bağımsız oyunların anlık oyuncu ölçümü

epic:
  enabled: true
  collections: [top-sellers, most-played, trending, most-popular, top-new-releases, top-wishlisted, top-player-reviewed]
  include_free_games: false   # haftalık ücretsiz oyunları da izle
  interval_minutes: 30

roblox:
  enabled: true
  recheck_hours: 6            # normal takipteki oyunlar
  hot_recheck_hours: 1.5      # FIRSAT / AKIM BAŞLADI durumundaki oyunlar
  clone_refresh_minutes: 15   # bilinen Roblox benzerlerinin anlık oyuncu takibi
  max_queries_per_game: 3
  request_delay_seconds: 1.0
  batch_size: 10
  probe_minutes: 5            # Roblox'a ulaşılamıyorsa (VPN kapalı, engelli ağ) kaç dakikada bir yoklansın
  outage_alert_minutes: 10    # kesinti bu kadar sürerse TEK uyarı gider; o zamana kadar Roblox'suz rapor verilir

filters:
  min_indie_score: 0.5        # 0 = AAA, 1 = tamamen bağımsız
  extra_major_publishers: []  # "büyük marka" sayılmasını istediğin ek yayıncılar
  extra_midtier_publishers: []
  allow_publishers: []        # listede olsa bile bağımsız sayılacak yayıncılar
  # ignore_titles: ["(?i)soundtrack", "(?i)\\bdlc\\b"]   # regex listesi (varsayılanı ezer)

scoring:
  # Roblox eşleştirme (bkz. README > Benzerlik nasıl hesaplanır)
  clone_threshold: 0.72         # isim / açıklama-atfı bu eşiği geçerse "klon"
  concept_clone_threshold: 0.75 # birleşik benzerlik bunu geçer ve oynanış örtüşüyorsa isim tutmasa da "klon"
  similar_threshold: 0.6        # bunun üstü "benzer oynanış"
  similar_weight: 0.35          # benzer oynanışlı oyunların Roblox doygunluğuna katkı ağırlığı (klon = 1.0)
  opportunity_threshold: 0.65
  watch_threshold: 0.5
  min_opportunity_momentum: 0.3
  rising_ratio: 1.8           # Roblox benzerlerinin oyuncusu 24 saatte bu kat artarsa AKIM BAŞLADI
  rising_min_playing: 150
  rank_surge_positions: 15    # bu kadar sıra tırmanış = sinyal
  ccu_surge_ratio: 1.5
  ccu_surge_min_players: 1000
  unverified_alert_momentum: 0.5   # Roblox doğrulanamıyorken "yükseliyor" bildirimi için en düşük momentum

# YouTube fragmanlarından henüz çıkmamış oyunları yakala (RSS: anahtarsız, hesapsız, ücretsiz).
# Roblox'ta karşılığı olması gerekmez; Roblox erişilebiliyorsa durumu ek bilgi olarak eklenir.
youtube:
  enabled: true
  interval_minutes: 60
  # channels: ["UC...", "@IGN"]   # varsayılan: Steam, IGN, GameSpot, GameTrailers, PC Gamer, Game Informer, GamesRadar,
                                  # Day of the Devs, Indie Game Trailers, IndieGame+, Devolver, Annapurna, Hooded Horse
  max_age_days: 10            # bundan eski videolar yok sayılır
  min_views: 2000             # bunun altındaki fragmanlar gürültü sayılır
  alert_buzz: 0.4             # bildirim için en düşük "ses getirme" puanı (0..1); 0.65 üstü yüksek öncelik
  alert_unlisted: true        # Steam sayfası olmayan (konsol/Epic/yeni duyuru) oyunlar için de bildir (eşik +0.15, orta öncelik)
  unlisted_max_views: 1500000 # bundan çok izlenen mağazasız fragmanlar büyük yapım sayılır
  check_roblox: true          # çıkmamış oyunu Roblox'ta da ara (zorunlu değil, ek bilgi)
  max_roblox_lookups_per_poll: 3

# İsteğe bağlı Laya karar modeli (Convai, Apache 2.0): yerel ve ücretsiz, API anahtarı/hesap gerekmez.
# Akım'da ücretli (kredi/API anahtarı isteyen) hiçbir bileşen yoktur.
# pip install "akim[laya]" (PyTorch gerekir). Ölçüm sonuçları ve öneriler: eval/README.md
laya:
  enabled: false
  mode: evidence            # evidence: diğer kanıtlara düşük güvenle eklenir | judge: son söz Laya'da
  checkpoint: ""            # "" = İngilizce kök model, "typed-decisions", "multilingual"
  model_path: ""            # bu göreve ince ayarladığın kendi checkpoint'in (judge moduyla önerilir)
  device: ""                # "" otomatik, "cpu", "cuda", "mps"
  reliability: 0.35         # evidence modunda Laya kanıtının ağırlığı
  max_candidates: 8         # oyun başına Laya'ya sorulacak aday (CPU'da her biri ~1-3 sn)
  min_prescore: 0.2
  batch_size: 8
  use_embeddings: false

notifications:
  cooldown_hours: 12          # aynı oyun + aynı olay için tekrar bildirim bekleme süresi
  digest_hours: 6             # periyodik özet (0 = kapalı)
  digest_size: 10
  startup_summary: true       # ilk açılışta bildirim yağmuru yerine tek özet
  channels:
    console:
      enabled: true
      min_priority: low

    # Telegram: @BotFather ile bot oluştur, sohbet kimliğini @userinfobot ile öğren.
    # commands: true ise /firsatlar, /kontrol <oyun>, /oyun <oyun>, /durum komutları çalışır.
    telegram:
      enabled: false
      bot_token: ${AKIM_TELEGRAM_BOT_TOKEN}
      chat_id: ${AKIM_TELEGRAM_CHAT_ID}
      min_priority: medium
      commands: true

    # Telefona anında push: ntfy uygulamasını kur, aşağıdaki konuya abone ol.
    # Konu adı tahmin edilemez olsun (ör. akim-4f9c2a7e), çünkü ntfy.sh herkese açıktır.
    ntfy:
      enabled: false
      server: https://ntfy.sh
      topic: ${AKIM_NTFY_TOPIC}
      min_priority: high

    discord:
      enabled: false
      webhook_url: ${AKIM_DISCORD_WEBHOOK_URL}
      min_priority: medium

    slack:
      enabled: false
      webhook_url: ${AKIM_SLACK_WEBHOOK_URL}
      min_priority: high

    # Herhangi bir sisteme JSON POST (n8n, Zapier, kendi sunucun...)
    webhook:
      enabled: false
      url: ${AKIM_WEBHOOK_URL}
      headers: {}
      min_priority: medium

    email:
      enabled: false
      smtp_host: smtp.gmail.com
      smtp_port: 587
      username: ${AKIM_SMTP_USER}
      password: ${AKIM_SMTP_PASSWORD}
      sender: ${AKIM_SMTP_USER}
      recipients: []
      min_priority: critical

    # Aynı türden birden fazla kanal için "tür:ad" kullan:
    # "discord:ekip": {enabled: true, webhook_url: "...", min_priority: high}

web:
  enabled: true
  # Varsayılan yalnızca bu cihaz. Telefondan/aynı Wi-Fi'dan açmak için "0.0.0.0" yap ve AKIM_WEB_TOKEN ayarla.
  # (Docker'da kapsayıcı içinde 0.0.0.0 gerekir; docker-compose.yml portu yalnızca bu makineye yayımlar.)
  host: 127.0.0.1
  port: 8080
  # Token doluysa kontrol uçları "Authorization: Bearer <token>" ister. Boşsa kontrol yalnızca bu cihazdan çalışır;
  # ağdaki cihazlar paneli okuyabilir ama Roblox sorgusu/yeniden tarama yapamaz.
  token: ${AKIM_WEB_TOKEN}
  # IP ve *.local dışındaki adlarla erişim için (ör. Tailscale: "pc.tailnet.ts.net"): DNS rebinding savunması
  allowed_hosts: []
